[project]
name = "fly_in"
version = "0.1.0"
description = "Multi-drone routing simulation."
readme = "README.md"
authors = [
    { name = "erakotom", email = "erakotom@student.42antananarivo.mg" }
]
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv-build]
source-dir = "src"
